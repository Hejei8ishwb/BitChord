name: Android Release APK

on:
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup local properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android App (Debug)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: List generated APKs
        run: find app/build/outputs/apk -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-patched-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
